# Railway configuration for scheduler service
# Deploys from src/ directory (has both scheduler/ and DAGS/)

[build]
builder = "nixpacks"

[build.nixpacks]
# Force Python 3.11 to avoid distutils issues in Python 3.12
pythonVersion = "3.11"

[deploy]
# Railway root directory is set to: src
# Nixpacks auto-installs from requirements.txt at build time
# Just run the scheduler
startCommand = "python scheduler/app.py"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
